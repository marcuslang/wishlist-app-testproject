{% extends 'wishlist/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>
    <p>No account yet? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
